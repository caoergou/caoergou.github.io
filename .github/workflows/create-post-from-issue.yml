name: Create Post from Issue

on:
  issues:
    types: [labeled]

jobs:
  create-post:
    # Only run when the 'thought' or 'post' label is added by the repo owner
    if: |
      (github.event.label.name == 'thought' || github.event.label.name == 'post') &&
      github.event.sender.login == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Create markdown file via GitHub API
        id: create-post
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';

            // Parse a section from GitHub issue form output.
            // Sections look like: "### Heading\n\nContent\n"
            function extractSection(text, heading) {
              const escaped = heading.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const re = new RegExp(
                `### ${escaped}\\s*\\n+([\\s\\S]*?)(?=\\n### |$)`
              );
              const m = text.match(re);
              if (!m) return '';
              // GitHub renders empty optional fields as "_No response_"
              return m[1].replace(/_No response_/g, '').trim();
            }

            const titleZh = extractSection(body, '标题（中文）') || issue.title;
            const titleEn = extractSection(body, 'Title (English)') || issue.title;
            const descZh  = extractSection(body, '描述（中文）');
            const descEn  = extractSection(body, 'Description (English)');
            const tagsRaw = extractSection(body, '标签 Tags（可选）');
            const content = extractSection(body, '正文内容（可选）');

            if (!titleZh || !titleEn || !descZh || !descEn) {
              core.setFailed('Missing required fields (title or description).');
              return;
            }

            // Parse tags into an array
            const tags = tagsRaw
              ? tagsRaw.split(',').map(t => t.trim().toLowerCase()).filter(Boolean)
              : [];

            // Generate slug: english title + issue number for uniqueness
            const date = new Date().toISOString().split('T')[0];
            const baseSlug = titleEn
              .toLowerCase()
              .replace(/[^a-z0-9\s-]/g, '')
              .replace(/\s+/g, '-')
              .replace(/-{2,}/g, '-')
              .replace(/^-|-$/g, '')
              .substring(0, 45);
            const slug = `${baseSlug}-${issue.number}`;

            const filepath = `src/content/thoughts/${slug}.md`;

            // Escape double quotes for YAML inline strings
            const esc = s => s.replace(/\\/g, '\\\\').replace(/"/g, '\\"');

            let md = [
              '---',
              'title:',
              `  zh: "${esc(titleZh)}"`,
              `  en: "${esc(titleEn)}"`,
              'description:',
              `  zh: "${esc(descZh)}"`,
              `  en: "${esc(descEn)}"`,
              'author: "Eric Cao"',
              `date: "${date}"`,
              ...(tags.length > 0 ? [`tags: [${tags.map(t => `"${esc(t)}"`).join(', ')}]`] : []),
              '---',
              '',
            ].join('\n');

            if (content) {
              md += content + '\n';
            }

            const encoded = Buffer.from(md).toString('base64');

            // Check if file already exists (need sha to update)
            let sha;
            try {
              const existing = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: filepath,
              });
              sha = existing.data.sha;
            } catch (_) {
              // File doesn't exist yet — that's fine
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: filepath,
              message: `feat: add thought from issue #${issue.number}\n\nSource: ${issue.html_url}`,
              content: encoded,
              sha,
              branch: 'main',
            });

            core.setOutput('slug', slug);
            core.setOutput('filepath', filepath);

      - name: Comment success and close issue
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const slug = '${{ steps.create-post.outputs.slug }}';
            const filepath = '${{ steps.create-post.outputs.filepath }}';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: [
                '✅ **文章已创建，正在部署...**',
                '',
                `文件：[\`${filepath}\`](../blob/main/${filepath})`,
                '',
                '站点将在几分钟内更新，部署进度可在 [Actions](../actions) 中查看。',
              ].join('\n'),
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              state: 'closed',
            });

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: [
                '❌ **文章创建失败**',
                '',
                '请检查以下几点：',
                '- 中英文标题、描述是否都已填写',
                '- 正文内容是否包含非法 YAML 字符',
                '',
                `详细错误信息：[查看 Actions 日志](../actions/runs/${{ github.run_id }})`,
              ].join('\n'),
            });
